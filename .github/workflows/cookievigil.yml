name: CookieVigil CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          python -m pytest tests/

      - name: Build vulnerable app Docker image
        run: |
          docker build -t vuln-app ./vulnerable_app

      - name: Run vulnerable app container
        run: |
          docker run -d --name vuln -p 5000:5000 vuln-app

      - name: Run CookieVigil scan
        run: |
          python audit_cookies.py http://localhost:5000/set-bad-cookies \
            --format all --output reports/gh_scan --fail-on none --insecure

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: cookievigil-reports
          path: reports/

      - name: Check security score (fail if < 70)
        run: |
          python audit_cookies.py http://localhost:5000/set-bad-cookies \
            --fail-score-below 70 --insecure
