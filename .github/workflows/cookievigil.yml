name: CookieVigil CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  tests:
    name: Tests unitaires et integration
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code source
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executer la suite de tests
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

  docker-lab:
    name: Laboratoire Docker DevSecOps
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Recuperer le code source
        uses: actions/checkout@v4

      - name: Construire les services Docker
        run: |
          docker compose build

      - name: Demarrer l'application vulnerable
        run: |
          docker compose up -d vulnerable-app

      - name: Verifier que l'application vulnerable est disponible
        run: |
          for i in {1..20}; do
            if curl -fsS http://localhost:5000/api/health; then
              echo "Application vulnerable disponible"
              exit 0
            fi
            sleep 2
          done
          echo "Application vulnerable indisponible"
          docker compose logs vulnerable-app
          exit 1

      - name: Preparer le dossier des rapports
        run: |
          mkdir -p reports
          sudo chown -R 1000:1000 reports
          sudo chmod -R u+rwX reports

      - name: Executer CookieVigil contre le laboratoire vulnerable
        run: |
          docker compose run --rm cookievigil \
            http://vulnerable-app:5000/set-bad-cookies \
            http://vulnerable-app:5000/set-weak-token \
            http://vulnerable-app:5000/set-jwt-cookie \
            http://vulnerable-app:5000/set-long-expiry \
            --force-https-context \
            --format all \
            --output ci_cookie_audit \
            --fail-on high

      - name: Publier les rapports comme artefacts
        uses: actions/upload-artifact@v4
        with:
          name: rapports-cookievigil
          path: reports/

      - name: Arreter les services Docker
        if: always()
        run: |
          docker compose down
